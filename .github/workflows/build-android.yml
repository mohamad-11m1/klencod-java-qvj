name: Build Android AAB
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'
          accept-android-sdk-licenses: true
      - name: Build release app bundle
        shell: bash
        run: |
          if [ -f gradlew ]; then chmod +x gradlew; ./gradlew --no-daemon :app:bundleRelease -x lint -x test; else gradle --no-daemon :app:bundleRelease -x lint -x test; fi
      - uses: actions/upload-artifact@v4
        with:
          name: klencod-java-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 7
